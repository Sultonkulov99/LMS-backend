name: Deploy LMS Backend to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-lms
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            APP_DIR=/var/www/lms/backend
            mkdir -p $APP_DIR /var/www/lms/uploads
            chown -R 1001:1001 /var/www/lms/uploads
            cd $APP_DIR

            REPO=https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Sultonkulov99/LMS-backend.git
            if [ ! -d .git ]; then
              git clone $REPO .
            else
              git remote set-url origin $REPO
              git fetch origin main
              git reset --hard origin/main
            fi

            if [ ! -f .env ]; then
              echo "❌ .env topilmadi: $APP_DIR/.env yarating (.env.example'dan)"
              exit 1
            fi

            # down QILINMAYDI: avval build, keyin faqat o'zgargan containerlar almashadi
            docker compose up -d --build --remove-orphans

            docker image prune -f
            docker builder prune -f
            docker compose ps
            docker compose logs --tail=30 app
