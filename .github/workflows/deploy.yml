name: Deploy LMS Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            mkdir -p /var/www/lms/backend
            cd /var/www/lms/backend

            # Git orqali kodni tortib olish (Sultonkulov99/LMS-backend)
            if [ ! -d ".git" ]; then
              git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Sultonkulov99/LMS-backend.git .
            else
              git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Sultonkulov99/LMS-backend.git
              git reset --hard
              git pull origin main
            fi

            # Konteynerlarni qayta qurish va ishga tushirish
            docker compose down --remove-orphans || true
            docker compose build --no-cache
            docker compose up -d

            # Eski keraksiz imagelarni tozalash
            docker image prune -f
