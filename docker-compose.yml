services:
  db:
    image: postgres:15-alpine
    container_name: lms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - lms_redis_data:/data

  app:
    build: .
    container_name: lms_backend
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://postgres:12345@db:5432/lms?schema=public"
      POSTGRES_HOST: db
      REDIS_HOST: redis
      PORT: 9000
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npx prisma generate && npx prisma db push && exec node dist/main.js"

volumes:
  lms_postgres_data:
  lms_redis_data:
